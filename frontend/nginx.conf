server {
    listen 80;
    server_name localhost;

    # ขนาดไฟล์อัปโหลดสูงสุด (สำหรับไฟล์ CSV)
    client_max_body_size 20M;

    # Static Web App (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy สำหรับ API และ Main Pipeline ไปยัง Backend Container
    location ~ ^/(query|part1|part2|part3|part4|docs|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ปรับ timeout สำหรับงาน AI ที่ใช้เวลาประมวลผล
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
